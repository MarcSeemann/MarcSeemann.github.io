<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery | Marc Seemann</title>
  <meta name="description" content="Photos from the lab: prototypes, fibers, crystals and more.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="header"></div>
  <main>
    <section class="hero short">
      <div class="overlay-box">
        <h2>Gallery</h2>
        <p>Pictures from the lab. Click an image to enlarge it.</p>
      </div>
    </section>

    <section class="content">
      <div class="wrap">
        <div class="gallery zoomable">
          <figure><img src="assets/images/web/HDDEMO_real_insideview.jpg" alt="Inside of HD-DEMO"><figcaption>HD-DEMO, view inside the barrel</figcaption></figure>
          <figure><img src="assets/images/web/pre_evaporation_fiber_panels.jpg" alt="Fiber panel before evaporation"><figcaption>Fiber panel before evaporation</figcaption></figure>
          <figure><img src="assets/images/web/raw_bundled_fibers.jpg" alt="Bundled WLS fibers glowing green"><figcaption>Bundled WLS fibers</figcaption></figure>
          <figure><img src="assets/images/web/cigar_inside_view_real.jpg" alt="Inside of CIGAR"><figcaption>Inside CIGAR</figcaption></figure>
          <figure><img src="assets/images/web/CsI_Tl_crystal_wrapped.jpg" alt="Wrapped CsI(Tl) crystal"><figcaption>Wrapped CsI(Tl) crystal</figcaption></figure>
          <figure><img src="assets/images/web/fully_encased_crystal_sipm.jpg" alt="Encased crystal and SiPM"><figcaption>Crystal and SiPM, light-tight</figcaption></figure>
          <figure><img src="assets/images/cigar_CAD.png" alt="CIGAR CAD cutaway" style="background:#fff"><figcaption>CIGAR CAD cutaway</figcaption></figure>
          <figure><img src="assets/images/web/rocks.jpg" alt="Layered rock cliffs"><figcaption>Rock cliffs</figcaption></figure>
          <figure><img src="assets/images/web/rocks_2.jpg" alt="Rock strata"><figcaption>Rock strata</figcaption></figure>
        </div>
      </div>
    </section>
  </main>
  <div id="footer"></div>
  <script src="script.js"></script>
